deepseek:
  base_url: https://api.deepseek.com
  model: deepseek-chat
  max_tokens: 4096

images:
  base_url: https://api.siliconflow.cn/v1
  model: Kwai-Kolors/Kolors
  image_size: "1024x1024"
  image_quality: standard

hot_topics:
  platforms:
    - weibo
    - baidu
    - toutiao
    - douyin
  top_n: 10           # 每个平台取前N条
  min_heat_rank: 20   # 只取榜单前20名内的热点

article_search:
  sources:
    - weixin
    - web
    - toutiao
    - zhihu
  max_per_topic: 5    # 每个热点最多抓取的文章数
  min_content_length: 300

article_writer:
  wechat_style: true
  target_length: 1500  # 目标字数（汉字）
  include_sections:
    - title
    - intro
    - body
    - summary

publisher:
  mode: appsecret     # appsecret=官方接口上传草稿，playwright=浏览器自动草稿，manual=仅导出发布包
  cover_image: false  # true=生成封面图后一起导出/上传
  default_thumb_media_id: "VuD3VjEAoFhvoryQWD4vppmSj48AxnfZK8V8PljWMIST4rbCpttCTTdYiTg8yeXq"  # cover_image=false 时使用的备用封面 media_id（从公众号素材库获取）
  author: 云中
  browser_channel: auto  # auto=自动探测 Edge/Chrome，失败时回退到 Playwright Chromium
  browser_profile_dir: data/browser_profiles/wechat
  timeout_ms: 15000
